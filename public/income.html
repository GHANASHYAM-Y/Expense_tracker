<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Income | Expense Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #003366; 
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #001f3f;
      color: white;
      padding-top: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      text-align: center;
      z-index: 1;
    }

    .sidebar h2 {
      color: #00d9ff;
      margin-bottom: 40px;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      font-size: 1.1rem;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover {
      background-color: #00d9ff;
      color: #001f3f;
      font-weight: bold;
    }

    /* Main Content */
    .main-content {
      margin-left: 250px;
      padding: 30px;
      flex-grow: 1;
      color: white;
      z-index: 1;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 1rem;
    }

    .income-section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1); /* Semi-transparent white */
    }

    .income-box {
      margin-top: 10px;
    }

    .income-box input {
      width: 90%;
      padding: 8px;
      margin-top: 5px;
    }

    .add-btn {
      background-color: #00d9ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #0086b3;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Expense Tracker</h2>
    <a href="home.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="income.html">Income</a>
    <a href="budget.html">Budget</a>
  </div>

  <div class="main-content">
    <h1>Income Tracker</h1>

    <div>
      <input type="text" id="incomeType" placeholder="Enter income type (e.g., Salary, Freelance)">
      <input type="number" id="entryCount" placeholder="How many entries?" min="1">
      <button class="add-btn" onclick="addIncomeSection()">Add Income</button>
    </div>

    <div id="incomeContainer"></div>
  </div>

  <canvas id="stars"></canvas>

  <script>
  function addIncomeSection() {
    const typeInput = document.getElementById("incomeType");
    const countInput = document.getElementById("entryCount");

    const type = typeInput.value.trim();
    const count = parseInt(countInput.value);

    if (!type || isNaN(count) || count < 1) {
      alert("Please enter a valid income type and number.");
      return;
    }

    const section = document.createElement("div");
    section.className = "income-section";

    const heading = document.createElement("h3");
    heading.textContent = `Income Source: ${type}`;
    heading.style.color = "#ffffff";
    section.appendChild(heading);

    const entryRefs = [];

    for (let i = 0; i < count; i++) {
      const box = document.createElement("div");
      box.className = "income-box";

      const label = document.createElement("label");
      label.textContent = `Amount ${i + 1}: `;
      label.style.color = "#ffffff";

      const input = document.createElement("input");
      input.type = "number";
      input.placeholder = `Enter amount ${i + 1} for ${type}`;

      box.appendChild(label);
      box.appendChild(document.createElement("br"));
      box.appendChild(input);
      section.appendChild(box);

      entryRefs.push(input);
    }

    const saveBtn = document.createElement("button");
    saveBtn.textContent = "Save to SQL";
    saveBtn.className = "add-btn";

    saveBtn.onclick = async function () {
      const amounts = entryRefs.map(input => parseFloat(input.value)).filter(v => !isNaN(v));

      if (amounts.length === 0) {
        alert("Please enter valid amounts.");
        return;
      }

      const body = { type, amounts };

      try {
        const res = await fetch("/api/income", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const result = await res.json();
        if (res.ok) {
          alert("Income data saved to SQL");
        } else {
          alert("Error: " + result.error);
        }
      } catch (err) {
        alert("Failed to send request: " + err.message);
      }
    };

    section.appendChild(saveBtn);
    document.getElementById("incomeContainer").appendChild(section);

    typeInput.value = '';
    countInput.value = '';
  }

  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createStars(count) {
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.2
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    stars.forEach(star => {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fill();
      star.y += star.speed;
      if (star.y > canvas.height) {
        star.y = 0;
        star.x = Math.random() * canvas.width;
      }
    });
  }

  function animateStars() {
    drawStars();
    requestAnimationFrame(animateStars);
  }

  createStars(100);
  animateStars();
</script>

</body>
</html>
