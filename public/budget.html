<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker | Expense Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #003366;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background-color: #001f3f;
      color: white;
      padding-top: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      text-align: center;
      z-index: 1;
    }

    .sidebar h2 {
      color: #00d9ff;
      margin-bottom: 40px;
    }

    .sidebar a {
      display: block;
      padding: 15px;
      font-size: 1.1rem;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      transition: background-color 0.3s ease;
    }

    .sidebar a:hover {
      background-color: #00d9ff;
      color: #001f3f;
      font-weight: bold;
    }

    .main-content {
      margin-left: 250px;
      padding: 30px;
      flex-grow: 1;
      color: white;
      z-index: 1;
      position: relative;
    }
   .progress-bar {
  background-color: #2e4e74;  /* Darker grayish-blue background */
  width: 100%;
  height: 20px;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background-color: orange; /* 🟠 NOW IT WILL BE ORANGE */
  border-radius: 10px;
  transition: width 0.5s ease-in-out;
}

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 1rem;
    }

    .income-section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .add-btn {
      background-color: #00d9ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #0086b3;
    }

    .expense-list, .budget-section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .alert {
      padding: 10px;
      margin-top: 20px;
      background-color: #ff5733;
      color: white;
      border-radius: 5px;
      display: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;

    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Expense Tracker</h2>
    <a href="home.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="income.html">Income</a>
    <a href="budget.html">Budget</a>
  </div>

  <div class="main-content">
    <h1>Budget Tracker</h1>

    <div>
      <input type="number" id="budgetAmount" placeholder="Enter your budget amount" />
      <button class="add-btn" onclick="setBudget()">Set Budget</button>
    </div>

    <div class="budget-section">
  <h3>Budget Remaining: ₹<span id="remainingBudget">0</span></h3>
  <div class="progress-bar">
    <div class="progress-bar-fill" id="progressBarFill"></div>
  </div>
</div>


    <div>
      <input type="text" id="expenseName" placeholder="Enter expense name" />
      <input type="number" id="expenseAmount" placeholder="Enter expense amount" />
      <button class="add-btn" onclick="addExpense()">Add Expense</button>
    </div>

    <div class="expense-list">
      <h3>Expenses List:</h3>
      <ul id="expenseItems"></ul>
      <h4>Total Expenses: ₹<span id="totalExpenses">0</span></h4>
    </div>

    <div id="alertMessage" class="alert">
      You have exceeded your budget! Please be careful while spending.
    </div>
  </div>

  <canvas id="stars"></canvas>
  <script>
  let totalBudget = 0;
  let totalExpenses = 0;

  function setBudget() {
    const budgetInput = document.getElementById("budgetAmount");
    const amount = parseFloat(budgetInput.value);

    if (isNaN(amount) || amount <= 0) {
      alert("Please enter a valid budget amount.");
      return;
    }

    totalBudget = amount;
    updateRemainingBudget();

    // 🎯 NOTE: Budget amount is just tracked locally in this version
    budgetInput.value = '';
  }

  function addExpense() {
    const nameInput = document.getElementById("expenseName");
    const amountInput = document.getElementById("expenseAmount");

    const name = nameInput.value.trim();
    const amount = parseFloat(amountInput.value);

    if (!name || isNaN(amount) || amount <= 0) {
      alert("Please enter valid expense details.");
      return;
    }

    fetch("http://localhost:3000/api/budget", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ category: name, amounts: [amount] })
    })
      .then(res => res.json())
      .then(data => {
        alert(data.message || "Expense saved!");

        // Update UI
        const list = document.getElementById("expenseItems");
        const item = document.createElement("li");
        item.className = "expense-item";
        item.textContent = `${name}: ₹${amount}`;
        list.appendChild(item);

        totalExpenses += amount;
        updateRemainingBudget();

        nameInput.value = '';
        amountInput.value = '';
      })
      .catch(err => {
        alert("Error saving expense: " + err.message);
      });
  }

  function updateRemainingBudget() {
    const remaining = totalBudget - totalExpenses;
    document.getElementById("remainingBudget").textContent = remaining.toFixed(2);
    document.getElementById("totalExpenses").textContent = totalExpenses.toFixed(2);

    const fill = document.getElementById("progressBarFill");
    const percent = totalBudget > 0 ? Math.min((totalExpenses / totalBudget) * 100, 100) : 0;
    fill.style.width = `${percent}%`;

    const alertBox = document.getElementById("alertMessage");
    alertBox.style.display = remaining < 0 ? "block" : "none";
  }

  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function createStars(count) {
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.2
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    stars.forEach(star => {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fill();
      star.y += star.speed;
      if (star.y > canvas.height) {
        star.y = 0;
        star.x = Math.random() * canvas.width;
      }
    });
  }

  function animate() {
    drawStars();
    requestAnimationFrame(animate);
  }

  createStars(100);
  animate();
</script>


</body>
</html>
